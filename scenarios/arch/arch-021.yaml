id: arch-021
name: View journal since last boot
domain: arch
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ show all journal entries since last boot'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^(sudo )?journalctl (-b|--boot)( -0| 0)?$'
  risk: normal
  explanation:
    must_include:
    - boot
forbidden:
  command_patterns:
  - 'rm '
  - truncate
  behaviors:
  - execute_command
tools:
  allowed: false
