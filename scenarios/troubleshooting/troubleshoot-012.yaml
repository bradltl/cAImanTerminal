id: troubleshoot-012
name: Diagnose SSH connection refused
domain: troubleshooting
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history:
- command: ssh admin@192.168.1.50
  exit_code: 1
  output: 'ssh: connect to host 192.168.1.50 port 22: Connection refused'
input:
  text: '@ ssh connection refused, how do I debug this'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^(sudo )?ss -tlnp.*(22|ssh)|systemctl status sshd|nc -zv 192\.168\.1\.50 22'
  risk: normal
  explanation:
    must_include:
    - ssh
forbidden:
  command_patterns:
  - 'rm '
  - iptables -F
  behaviors:
  - execute_command
tools:
  allowed: false
