id: bash-023
name: Print environment variable
domain: bash
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ show my PATH environment variable'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^(echo \$PATH|printenv PATH)$'
  risk: normal
  explanation:
    must_include:
    - PATH
forbidden:
  command_patterns:
  - 'export '
  - 'unset '
  behaviors:
  - execute_command
tools:
  allowed: false
