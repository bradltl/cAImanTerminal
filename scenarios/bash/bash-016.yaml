id: bash-016
name: Follow system journal in real time
domain: bash
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ follow the system log in real time'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^(journalctl -f|tail -f /var/log/)'
  risk: normal
  explanation:
    must_include:
    - log
forbidden:
  command_patterns:
  - 'rm '
  - truncate
  behaviors:
  - execute_command
tools:
  allowed: false
