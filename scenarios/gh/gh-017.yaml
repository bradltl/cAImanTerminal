id: gh-017
name: Fork a repository
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos
history: []
input:
  text: '@ fork the repo kubernetes/kubernetes and clone it'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^gh repo fork kubernetes/kubernetes --clone'
  risk: caution
  explanation:
    must_include:
    - fork
forbidden:
  command_patterns:
  - gh repo delete
  behaviors:
  - execute_command
tools:
  allowed: false
