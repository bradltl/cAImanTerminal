[package]
name = "cayman-terminal"
version = "0.1.0"
edition = "2021"
description = "A native, local-only assisted Bash terminal"

[features]
default = ["desktop", "inference"]
desktop = ["dep:gtk", "dep:vte"]
inference = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
shlex = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
wait-timeout = "0.2"
libc = "0.2"
sha2 = "0.10"
gtk = { package = "gtk4", version = "0.10", optional = true }
vte = { package = "vte4", version = "0.9", features = ["v0_76"], optional = true }
llama-cpp-2 = { version = "=0.1.156", default-features = false, optional = true }
encoding_rs = { version = "0.8", optional = true }
