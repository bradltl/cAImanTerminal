id: bash-010
name: Count lines in a file
domain: bash
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/project
history: []
input:
  text: '@ how many lines are in README.md'
expected:
