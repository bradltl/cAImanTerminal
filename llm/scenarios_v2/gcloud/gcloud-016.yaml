id: gcloud-016
name: Set default compute region
domain: gcloud
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ set my default compute region to europe-west1'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^gcloud config set compute/region europe-west1$'
  risk: caution
  explanation:
    must_include:
    - region
forbidden:
  command_patterns:
  - gcloud config unset
  behaviors:
  - execute_command
tools:
  allowed: false
