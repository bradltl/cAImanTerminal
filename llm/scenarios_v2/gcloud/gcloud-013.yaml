id: gcloud-013
name: List Cloud Storage buckets
domain: gcloud
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ list all my GCS buckets'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^(gcloud storage (buckets list|ls)|gsutil ls)$'
  risk: normal
  explanation:
    must_include:
    - bucket
forbidden:
  command_patterns:
  - gsutil rm
  - gcloud storage rm
  behaviors:
  - execute_command
tools:
  allowed: false
