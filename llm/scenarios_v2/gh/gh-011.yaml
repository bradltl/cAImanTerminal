id: gh-011
name: Close an issue by number
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos/myproject
history: []
input:
  text: '@ close issue 73'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^gh issue close 73$'
  risk: caution
  explanation:
    must_include:
    - '73'
forbidden:
  command_patterns:
  - gh issue delete
  behaviors:
  - execute_command
tools:
  allowed: false
