id: arch-014
name: Rebuild initramfs for all presets
domain: arch
difficulty: advanced
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ regenerate the initramfs images'
