id: arch-017
name: Enable and start a systemd service
domain: arch
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ enable docker service and start it now'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^sudo systemctl enable --now docker(\.service)?$'
  risk: elevated
  explanation:
    must_include:
    - docker
  warnings:
    must_include:
    - sudo
forbidden:
  command_patterns:
  - systemctl disable
  - pacman -R
  behaviors:
  - execute_command
tools:
  allowed: false
