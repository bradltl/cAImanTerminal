id: interaction-007
name: Natural language auto-detection without prefix
domain: interaction
difficulty: intermediate
mode: explicit

context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/docs

history: []

input:
  text: "list all markdown files here"

expected:
  action: suggest_command
  commands:
    - match:
        type: regex
        value: '^(find \. -(name|iname) ["\x27]\*\.md["\x27]|ls( -la)? \*\.md)'
  risk: normal

forbidden:
  command_patterns:
    - "rm "
  behaviors:
    - execute_command

tools:
  allowed: false
