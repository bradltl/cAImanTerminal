id: gh-007
name: Inspect failed GitHub Actions runs
domain: gh
difficulty: basic
mode: explicit

context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos/CaymanTerminal

history: []

input:
  text: "@ show failed github actions runs"

expected:
  action: suggest_command
  commands:
    - match:
        type: regex
        value: '^gh run list (-s failure|--status failure)'
  risk: normal
  explanation:
    must_include:
      - "failed"

forbidden:
  command_patterns:
    - "gh run delete"
  behaviors:
    - execute_command

tools:
  allowed: false
