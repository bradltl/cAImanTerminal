id: gh-001
name: List open pull requests
domain: gh
difficulty: basic
mode: explicit

context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos/CaymanTerminal

history: []

input:
  text: "@ show open pull requests"

expected:
  action: suggest_command
  commands:
    - match:
        type: regex
        value: '^gh pr list( --state open)?$'
  risk: normal
  explanation:
    must_include:
      - "pull request"

forbidden:
  command_patterns:
    - "gh pr close"
  behaviors:
    - execute_command

tools:
  allowed: false
