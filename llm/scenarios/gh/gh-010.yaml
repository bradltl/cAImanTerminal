id: gh-010
name: Create a new issue
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos/myproject
history: []
input:
  text: '@ create an issue titled "Fix login timeout bug"'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^gh issue create (-t|--title) ["\x27]Fix login timeout bug["\x27]'
  risk: caution
  explanation:
    must_include:
    - issue
forbidden:
  command_patterns:
  - gh issue close
  - gh issue delete
  behaviors:
  - execute_command
tools:
  allowed: false
