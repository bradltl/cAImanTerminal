id: gcloud-035
name: Copy local dataset archive to GCS bucket
domain: gcloud
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ copy dataset_2026.parquet to gs://data-warehouse-lake/'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(gcloud storage cp dataset_2026\.parquet gs://data-warehouse-lake/?|gsutil
        cp dataset_2026\.parquet gs://data-warehouse-lake/?)$
  risk: normal
  explanation:
    must_include:
    - copy
forbidden:
  command_patterns:
  - 'rm '
  behaviors:
