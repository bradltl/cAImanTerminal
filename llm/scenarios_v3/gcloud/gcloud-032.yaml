id: gcloud-032
name: Read logs for Cloud Run payments-service
domain: gcloud
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ show cloud run logs for service payments-service'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^gcloud logging read ['"]resource\.type=cloud_run_revision AND resource\.labels\.service_name=payments-service['"]
  risk: normal
  explanation:
    must_include:
    - log
forbidden:
  command_patterns:
  - gcloud run services delete
  behaviors:
  - execute_command
tools:
  allowed: false
