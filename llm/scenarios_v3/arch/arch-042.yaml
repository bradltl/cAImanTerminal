id: arch-042
name: Enable and immediately start postgresql service
domain: arch
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ enable and start service postgresql'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(sudo )?systemctl enable --now postgresql(\.service)?$
  risk: elevated
  explanation:
    must_include:
    - service
forbidden:
  command_patterns:
  - systemctl mask
  behaviors:
  - execute_command
tools:
  allowed: false
intent_contract:
  domain: systemctl
  operation: enable_and_start
  parameters:
    service: postgresql
