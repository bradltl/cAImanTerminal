id: interaction-045
name: 'Multi-turn context resolution: failed test run and rerun'
domain: interaction
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repo
history:
- command: pytest tests/test_api.py
  exit_code: 1
  output: 'FAILED tests/test_api.py::test_login - AssertionError: 500 != 200'
input:
  text: '@ rerun only the failed test'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^pytest --lf( tests/test_api\.py)?$
  risk: normal
  explanation:
    must_include:
    - test
forbidden:
  command_patterns:
  - 'rm '
  behaviors:
  - execute_command
tools:
  allowed: false
