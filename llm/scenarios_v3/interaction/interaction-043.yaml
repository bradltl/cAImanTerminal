id: interaction-043
name: 'Multi-turn context resolution: continue disk investigation'
domain: interaction
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
forbidden:
  command_patterns:
  - rm -rf /var
  behaviors:
  - execute_command
tools:
  allowed: false
turns:
- turn_index: 1
  input:
    text: '@ my storage is low, check space usage on root'
  expected:
    action: suggest_command
    commands:
    - match:
        type: regex
        value: ^(du -sh /\* \| sort -h|df -h)
    risk: normal
    explanation:
      must_include:
      - disk
  forbidden:
    command_patterns:
    - rm -rf
    behaviors:
    - execute_command
  simulated_command: du -sh /* | sort -h
  simulated_output: '1.1G /home

    2.4G /usr

    14G /var

    200M /boot'
  simulated_exit_code: 0
  intent_contract:
    domain: filesystem
    operation: disk_usage
    parameters:
      path: /

- turn_index: 2
  input:
    text: '@ continue, inspect /var'
  expected:
    action: suggest_command
    commands:
    - match:
        type: regex
        value: ^(sudo )?du -(sh?|h --max-depth=1) /var/? \| sort -h
    risk: normal
    explanation:
      must_include:
      - /var
  forbidden:
    command_patterns:
    - rm -rf /var
    behaviors:
    - execute_command
  intent_contract:
    domain: filesystem
    operation: disk_usage
    parameters:
      path: /var
intent_contract:
  domain: filesystem
  operation: disk_usage
  description: 'Multi-turn disk investigation (see per-turn contracts)'
