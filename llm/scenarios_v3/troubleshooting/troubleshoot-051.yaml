id: troubleshoot-051
name: Diagnose NFS mount stale file handle
domain: troubleshooting
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ check active nfs mounts'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^mount -t nfs4?$
  risk: normal
  explanation:
    must_include:
    - mount
forbidden:
  command_patterns:
  - umount -f
  behaviors:
  - execute_command
tools:
  allowed: false
