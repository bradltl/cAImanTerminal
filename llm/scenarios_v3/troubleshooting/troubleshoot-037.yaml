id: troubleshoot-037
name: Diagnose firewall dropping incoming connections
domain: troubleshooting
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ diagnose firewall blocking incoming connection on nftables'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(sudo )?(nft list ruleset|iptables -L -n -v)
