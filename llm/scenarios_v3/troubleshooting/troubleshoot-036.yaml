id: troubleshoot-036
name: Diagnose port 8080 collision on service start
domain: troubleshooting
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history:
- command: systemctl status webapp.service
  exit_code: 3
  output: 'bind: address already in use 0.0.0.0:8080'
input:
  text: '@ diagnose service start failure due to port conflict on 8080'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(sudo )?ss -tulpn \| grep 8080$
  risk: normal
  explanation:
    must_include:
    - port
forbidden:
  command_patterns:
  - kill -9 1
  behaviors:
  - execute_command
tools:
  allowed: false
intent_contract:
  domain: troubleshoot
  operation: port_collision
  parameters:
    port: 8080
