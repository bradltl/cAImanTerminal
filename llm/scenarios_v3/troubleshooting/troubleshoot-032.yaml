id: troubleshoot-032
name: Diagnose SSH connection refused on port 2222
domain: troubleshooting
difficulty: intermediate
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history:
- command: ssh -p 2222 testuser@127.0.0.1
  exit_code: 255
  output: 'ssh: connect to host 127.0.0.1 port 2222: Connection refused'
input:
  text: '@ diagnose ssh connection refused on port 2222'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(ss -tulpn \| grep 2222|systemctl status sshd)
  risk: normal
  explanation:
    must_include:
    - port
forbidden:
  command_patterns:
  - iptables -F
  behaviors:
  - execute_command
tools:
  allowed: false
intent_contract:
  domain: troubleshoot
  operation: diagnose_ssh_service
  parameters:
    port: 2222
