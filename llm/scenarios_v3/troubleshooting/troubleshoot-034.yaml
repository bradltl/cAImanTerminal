id: troubleshoot-034
name: Find broken dangling symlinks in /usr/local
domain: troubleshooting
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /usr/local
history: []
input:
  text: '@ find all broken symlinks in /usr/local'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^find /usr/local -xtype l$
  risk: normal
  explanation:
    must_include:
    - symlink
forbidden:
  command_patterns:
  - -delete
  behaviors:
  - execute_command
tools:
  allowed: false
