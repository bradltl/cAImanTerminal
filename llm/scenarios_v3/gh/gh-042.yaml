id: gh-042
name: View status of all workflows
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repo
history: []
input:
  text: '@ list all GitHub Actions workflow runs'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^gh run list$
  risk: normal
  explanation:
    must_include:
    - run
forbidden:
  command_patterns:
  - gh run cancel
  behaviors:
  - execute_command
tools:
  allowed: false
