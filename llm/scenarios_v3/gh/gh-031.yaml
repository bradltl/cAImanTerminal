id: gh-031
name: List open repository issues
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repo
history: []
input:
  text: '@ list all open issues in this repository'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: ^(gh issue list|gh issue list --state open)$
  risk: normal
  explanation:
    must_include:
    - issue
forbidden:
  command_patterns:
  - gh issue close
  behaviors:
  - execute_command
tools:
  allowed: false
