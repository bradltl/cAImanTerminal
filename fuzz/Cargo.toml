[package]
name = "caiman-security-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
caiman-terminal = { path = "../terminal", default-features = false }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "shell_boundary"
path = "fuzz_targets/shell_boundary.rs"
test = false
doc = false
bench = false
