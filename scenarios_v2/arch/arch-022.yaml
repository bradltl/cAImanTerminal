id: arch-022
name: List failed systemd units
domain: arch
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser
history: []
input:
  text: '@ are there any failed systemd services'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^systemctl (--failed|list-units --state=failed)$'
  risk: normal
  explanation:
    must_include:
    - failed
forbidden:
  command_patterns:
  - systemctl restart
  - systemctl reset-failed
  behaviors:
  - execute_command
tools:
  allowed: false
