id: gh-013
name: Approve a pull request
domain: gh
difficulty: basic
mode: explicit
context:
  os:
    id: cachyos
    base: arch
  shell: bash
  cwd: /home/testuser/repos/myproject
history: []
input:
  text: '@ approve PR 88'
expected:
  action: suggest_command
  commands:
  - match:
      type: regex
      value: '^gh pr review 88 --approve$'
  risk: caution
  explanation:
    must_include:
    - approv
forbidden:
  command_patterns:
  - gh pr merge
  - gh pr close
  behaviors:
  - execute_command
tools:
  allowed: false
