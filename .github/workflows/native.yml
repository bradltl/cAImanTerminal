name: cAIman Terminal and LLM research
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_model:
        description: Run the default-model regression on a provisioned trusted runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  vulkan-build:
    # Hosted runners establish build/API conformance, not physical GPU use.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vulkan development dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config libvulkan-dev glslc spirv-headers
      - name: Build Vulkan backend and exercise selection and fallback
        run: cargo test --locked --no-default-features --features gpu-vulkan --lib inference::tests
      - name: Verify headless GPU settings and no-load reporting
        run: cargo test --locked --no-default-features --features gpu-vulkan --test settings_contract --test gpu_runtime
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libvte-2.91-gtk4-dev libclang-dev cmake pkg-config librsvg2-bin xvfb dbus-x11 libxtst6
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Real GTK and Bash, including physical-key staging and OSC isolation
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo CAYMAN_TEST_X11_KEYS=1 cargo test --locked --lib ui::tests::desktop_flow -- --ignored --nocapture
      - name: Real PTY lifecycle and delayed request boundaries
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo cargo test --locked --lib ui::tests::lifecycle_boundary -- --ignored --nocapture
      - name: AI-disabled desktop
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo cargo test --locked --lib ui::tests::disabled_ai_hides_pane -- --ignored --nocapture
      - name: Settings desktop
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo cargo test --locked --lib settings_ui::tests::settings_window -- --ignored --nocapture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './llm[test]'
      - run: python -m pytest llm/tests
      - run: cargo build --locked
      - run: python llm/tools/conformance.py
      - run: python llm/tools/dataset_audit.py
      - run: python llm/tools/mutation_check.py
  live-model:
    timeout-minutes: 60
    # Correctness smoke covers the frozen ten-request corpus twice. Full 3x200
    # profiling remains a deliberate CLI run, not an alpha latency obligation.
    env:
      CAYMAN_BENCH_RUNS: '1'
      CAYMAN_BENCH_SAMPLES: '20'
    if: github.event_name == 'workflow_dispatch' && inputs.live_model
    # Deliberately not a PR job. Provision model via CAIMAN_TEST_MODEL; digest is
    # checked by the loader. Do not execute untrusted PR code on this runner.
    runs-on: [self-hosted, linux, caiman-model]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --test llm_harness default_model_harness -- --ignored --nocapture
      - run: cargo build --locked
      - run: ./target/debug/caiman-terminal --model "$CAIMAN_TEST_MODEL" --ask 'show disk usage'
      - id: release
        run: cargo build --release --locked
      - name: Production correctness smoke and latency diagnostics
        shell: bash
        run: ./target/release/caiman-terminal --model "$CAIMAN_TEST_MODEL" --alpha-benchmark > alpha-latency.json
      - name: Independent model-path correctness smoke and latency diagnostics
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        shell: bash
        env:
          CAYMAN_BENCH_MODEL_PATH: '1'
        run: ./target/release/caiman-terminal --model "$CAIMAN_TEST_MODEL" --alpha-benchmark > alpha-model-latency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-latency
          path: |
            alpha-latency.json
            alpha-model-latency.json
